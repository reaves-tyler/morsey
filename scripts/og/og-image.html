<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #09090b;
    color: #f4f4f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    position: relative;
  }
  .glow {
    position: absolute; right: -160px; top: -160px; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(16,185,129,0.22), rgba(16,185,129,0));
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.2));
  }
  .wrap { position: absolute; left: 80px; top: 78px; right: 80px; bottom: 70px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .mark {
    width: 72px; height: 72px; border-radius: 16px; background: rgba(16,185,129,0.15);
    color: #34d399; font: 600 30px/72px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-align: center;
    border: 1px solid rgba(16,185,129,0.35);
  }
  .name { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
  h1 { margin: 44px 0 0; font-size: 64px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em; max-width: 980px; }
  h1 span { color: #34d399; }
  .sub { margin-top: 22px; font-size: 27px; color: #a1a1aa; max-width: 960px; line-height: 1.35; }
  .chips { margin-top: auto; display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    padding: 10px 18px; border-radius: 999px; border: 1px solid #27272a; background: #18181b;
    color: #d4d4d8; font-size: 21px;
  }
  .code {
    position: absolute; right: 80px; top: 136px; font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: rgba(52,211,153,0.7); letter-spacing: 0.08em;
  }
  .url { position: absolute; right: 80px; top: 92px; font-size: 26px; color: #71717a; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="wrap">
    <div class="brand">
      <div class="mark">-.-</div>
      <div class="name">Morsey</div>
    </div>
    <h1>Learn Morse code <span>by ear</span>.<br>Free, open source, in your browser.</h1>
    <div class="sub">Koch method · Farnsworth timing · sending with a real key · QSO simulator · live CW decoder for your rig</div>
    <div class="chips">
      <div class="chip">No account</div>
      <div class="chip">Works offline</div>
      <div class="chip">USB paddle support</div>
      <div class="chip">Ham radio · CW</div>
    </div>
  </div>
  <div class="url">morsey.net</div>
  <div class="code">-- --- .-. ... . -.--</div>
</body>
</html>
